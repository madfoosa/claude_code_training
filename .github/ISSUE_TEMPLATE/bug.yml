name: Bug report
description: Something behaves differently from how it should
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        The gap between "expected" and "actual" *is* the bug. A report with only
        "it's broken" is unactionable for a human and worse for an agent, which
        will guess at the intended behaviour and may guess wrong.

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen, and what makes you believe that — a docstring, a test, the README?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead. Paste the real output or error, not a paraphrase.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest set of steps that triggers it. A failing test case is ideal.
      placeholder: |
        1. `make setup`
        2. Construct a bucket with capacity=5, refill=1
        3. Call try_acquire(6)
    validations:
      required: true

  - type: dropdown
    id: stack
    attributes:
      label: Which slice
      options:
        - Python
        - TypeScript
        - Both
        - Neither — the kit itself (hooks, rules, skills, docs)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Version, environment, when it started, what you already ruled out.
